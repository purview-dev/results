name: PR

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not one of the default activity types, so a draft PR would never
    # re-evaluate the required build gate once it is marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      # The shared workflow defaults to the 10.0.x SDK, but this repository targets net11.0 and pins
      # the .NET 11 SDK in global.json. Without the matching SDK the runner cannot resolve global.json
      # ("A compatible .NET SDK was not found") and every step fails.
      # Keep in sync with `sdk.version` in global.json.
      dotnet-version: "11.0.100-rc.3.26522.148"
      # Mirrors Build:TestFilter in purview-build.json: every test project is a *.UnitTests project
      # whose tests the SDK categorises as Unit.
      test-filter: "/*/*/*/*[Category=Unit]"
      # All four library projects are packable, so pack and validate the produced packages.
      run-pack: true
      validate-pack: true
    secrets: inherit

  # Every other job builds against ProjectReferences; this one builds what ships. It packs every Purview.Results
  # package to an isolated feed and package cache, then publishes and runs consumers that reference the packages only -
  # a Native AOT console, a Blazor WebAssembly app (trimmed and RunAOTCompilation, run in headless Chrome), a Blazor
  # Server app (minimal API, static form, interactive page) and a net10.0 console - and leak-scans every bin and
  # publish folder for compiler-host assemblies. It then proves every PackValidation ForbiddenContent rule rejects a
  # package. `just smoke-packed-consumers` and `just verify-pack-rules` run the same locally.
  packed-consumers:
    name: Packed consumers (Native AOT, Blazor WebAssembly, Blazor Server)
    runs-on: ubuntu-latest
    env:
      # An extra feed for Purview.SourceGeneratorFramework*, Purview.ZodSharp* and Purview.ValueObjects only, for
      # versions that are not on nuget.org yet. Unset, the gate restores them from nuget.org alone.
      RESULTS_DEPENDENCY_FEED: ${{ vars.RESULTS_DEPENDENCY_FEED }}
    steps:
      - uses: actions/checkout@v7

      # The SDK from global.json, plus the .NET 10 runtime the net10.0 consumer runs on.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # First, before any toolchain is installed: the generator is built against the pinned
      # Purview.SourceGeneratorFramework, and the packages and consumers use the pinned Purview.ZodSharp and
      # Purview.ValueObjects. Until all three are on nuget.org (or the RESULTS_DEPENDENCY_FEED repository variable names
      # a feed that has them) this fails here, with what to do, rather than skipping.
      - name: Check the build-time and consumer dependencies restore
        shell: pwsh
        run: ./scripts/test-packed-consumers.ps1 -PreflightOnly

      # Native AOT links with clang and needs the zlib headers; the hosted image may not carry both.
      - name: Install the Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # RunAOTCompilation needs the Emscripten toolchain and the Mono AOT cross compiler. -WasmAot Require below makes
      # a missing workload an error instead of a skipped step.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # The hosted image ships Google Chrome; -Browser Require fails if it ever stops doing so.
      - name: Pack, then publish, run and leak-scan consumers of the packages
        shell: pwsh
        run: >-
          ./scripts/test-packed-consumers.ps1 -RuntimeIdentifier linux-x64 -WasmAot Require -Browser Require
          -PackOutput artifacts/packed

      - name: Prove every pack-validation forbidden-content rule rejects a package
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/test-pack-validation-rules.ps1 -PackagesFolder artifacts/packed
